# The CineArch iPhone app. Generate the Xcode project with: npm run ios:project
# (xcodegen). App sources live in CineArch/ (a synced folder: new files show
# up in Xcode automatically). Pay rules and the union engine are in CineArchKit.
name: CineArch
options:
  bundleIdPrefix: ca.cinearch
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
  CineArchKit:
    path: CineArchKit
targets:
  CineArch:
    type: application
    platform: iOS
    sources:
      - path: CineArch
        type: syncedFolder
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.cinearch.app
        PRODUCT_NAME: CineArch
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CineArch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a receipt or pay stub to back a Wrap Wallet entry with proof.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: CineArchKit
