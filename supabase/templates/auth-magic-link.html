<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><title>Your sign-in link.</title></head>
<body style="margin:0;padding:0;background:#f3f2ec">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#f3f2ec"><tr><td align="center" style="padding:24px 12px">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;background:#ffffff">
    <tr><td style="background:#0b0b0a;padding:18px 28px"><span style="font:italic 26px/1 Georgia, 'Times New Roman', serif;color:#ffffff">Ca</span><span style="font:700 11px/1 -apple-system, 'Helvetica Neue', Arial, sans-serif;letter-spacing:4px;color:#ffffff;padding-left:8px">CINEARCH</span></td></tr>
    <tr><td style="height:10px;line-height:10px;font-size:0;background:repeating-linear-gradient(-45deg,#facc15 0 10px,#0b0b0a 10px 20px);background-color:#facc15">&nbsp;</td></tr>
    <tr><td style="padding:32px 28px 8px">
      <p style="margin:0 0 10px;font:700 11px/1 -apple-system, 'Helvetica Neue', Arial, sans-serif;letter-spacing:3px;text-transform:uppercase;color:#5d5a50">Sign in</p>
      <h1 style="margin:0 0 20px;font:italic 400 34px/1.1 Georgia, 'Times New Roman', serif;color:#0b0b0a">Your sign-in link.</h1>
      <p style="margin:0 0 16px;font:16px/1.55 -apple-system, 'Helvetica Neue', Arial, sans-serif;color:#0b0b0a">Tap below to sign in to CineArch as {{ .Email }}.</p>
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 24px"><tr><td style="background:#facc15">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font:700 13px/1 -apple-system, 'Helvetica Neue', Arial, sans-serif;letter-spacing:2px;text-transform:uppercase;color:#0b0b0a;text-decoration:none">Sign in</a>
      </td></tr></table>
      <p style="margin:0 0 24px;font:13px/1.55 -apple-system, 'Helvetica Neue', Arial, sans-serif;color:#5d5a50">The link works once and expires in an hour. If you didn't ask to sign in, ignore this email.</p>
    </td></tr>
    <tr><td style="padding:18px 28px 26px;border-top:1px solid #e4e2da;font:12px/1.6 -apple-system, 'Helvetica Neue', Arial, sans-serif;color:#5d5a50">CineArch, the cast and crew tracker. This email is about your account, so it can't be turned off.</td></tr>
  </table>
</td></tr></table></body></html>
